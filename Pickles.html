<!DOCTYPE html>
<html style="max-width: 100%; margin: auto; padding: .5in; background-color: rgb(230,230,230);">
<head>
    <title>Pickles</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <style>
        summary { font-weight: bold; font-size: larger; color: rgb(219,0,56); padding-top: 1em; padding-bottom: 1em; }
        h1, h2, h3, h4, h5 { color: rgb(219,0,56); text-align: center; }
        td:nth-child(1) { width: 4em; }
        td { padding-bottom: .5em; }
        tr td:first-child { color: rgb(219,0,56); }
        h3 { display: none; }
        @media print {
            html { padding: 0 !important; }
            body { outline: none !important; }
            summary { display: none !important; }
            h3 { display: block; text-align: left; }
        }
    </style>
</head>
<body style="max-width: 7.5in; height: 10in; margin: auto; padding: .5in; outline: dashed; outline-color: gray; background-color: white;">
<h2>Pickles</h2>
<h5>Serves 4</h5>
<details open>
    <summary>Ingredients</summary>
    <h3>Ingredients</h3>
    <table>
        <tr>
            <td>2/3</td>
            <td>cup distilled white vinegar</td>
        </tr>
        <tr>
            <td>1 1/2</td>
            <td>tablespoon salt</td>
        </tr>
        <tr>
            <td>1</td>
            <td>tablespoon sugar</td>
        </tr>
        <tr>
            <td>1</td>
            <td>cup cold water</td>
        </tr>
        <tr>
            <td>1</td>
            <td>pound cucumbers</td>
        </tr>
        <tr>
            <td>1</td>
            <td>teaspoon diced garlic</td>
        </tr>
        <tr>
            <td>1/2</td>
            <td>teaspoon mustard seeds</td>
        </tr>
        <tr>
            <td>1/8</td>
            <td>teaspoon red pepper flakes</td>
        </tr>
        <tr>
            <td>1</td>
            <td>tablespoon dill</td>
        </tr>
    </table>
</details>
</body>
</html>
